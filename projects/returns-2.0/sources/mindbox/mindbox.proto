syntax = "proto3";

option go_package = "gitlab.12storeez.com/backend/go/proto-specifications.git/pkg/go/mindbox";

package mindbox;

service User {
    rpc Create (UpsertUserRequest) returns (UpsertUserResponse) {
    }
    rpc Update (UpsertUserRequest) returns (UpsertUserResponse) {
    }
    rpc UpdateMobile (UpsertUserRequest) returns (UpsertUserResponse) {
    }
    rpc Delete (DeleteUserRequest) returns (DeleteUserResponse) {
    }
    rpc Info (ParamsUser) returns (ResponseUser) {
    }
    rpc Orders (ParamsOrders) returns (ResponseOrders) {
    }
    rpc SendOSMICard (ParamsOSMICard) returns (ResponseOSMICard) {
    }
    rpc BonusesHistory (BonusesHistoryRequest) returns (BonusesHistoryResponse) {
    }
    rpc BonusesOffline (BonusesOfflineRequest) returns (BonusesOfflineResponse) {
    }
    rpc CheckOffline (CheckOfflineRequest) returns (CheckOfflineResponse) {
    }
    rpc CreateOffline (CreateOfflineRequest) returns (CreateOfflineResponse) {
    }
    rpc UpdateOffline (UpdateOfflineRequest) returns (StatusResponse) {
    }
    rpc CheckEmailSubscription(CheckEmailSubscriptionRequest) returns (CheckEmailSubscriptionResponse) {
    }
    rpc OrderSubscription(OrderSubscriptionRequest) returns (OrderSubscriptionResponse) {
    }
    rpc LoyaltyBalance(LoyaltyBalanceRequest) returns (LoyaltyBalanceResponse) {
    }
}

service Mobile {
    rpc InitDevice(InitDeviceParams) returns (InitDeviceResponse) {
    }
    rpc InitClient(InitClientParams) returns (InitClientResponse) {
    }
    rpc RemoveDevice(RemoveDeviceParams) returns (RemoveDeviceResponse) {
    }
    rpc Code (ParamsCode) returns (ResponseCode) {
    }
    rpc CheckCode (ParamsCheckCode) returns (ResponseCheckCode) {
    }
    rpc EditUser (ParamsEditUser) returns (ResponseEditUser) {
    }
    rpc IsUserExist (IsUserExistParams) returns (IsUserExistResponse) {
    }
    rpc PushClick(PushClickParams) returns (PushClickResponse) {
    }
}

service Order {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    }
    rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse) {
    }
    rpc UpdateOrderV2(UpdateOrderV2Request) returns (UpdateOrderV2Response) {
    }
    rpc GetOrderInfo(GetOrderInfoRequest) returns (GetOrderInfoResponse) {
    }
    rpc CalculateAuthorized(CalculateRequest) returns (CalculateResponse) {
    }
    rpc CalculateUnauthorized(CalculateRequest) returns (CalculateResponse) {
    }
    rpc UnauthorizedPreorderOffline(UnauthorizedPreorderOfflineRequest) returns (UnauthorizedPreorderOfflineResponse) {} // tnt-1980
    rpc AuthorizedPreorderOffline(AuthorizedPreorderOfflineRequest) returns (AuthorizedPreorderOfflineResponse) {} // tnt-1951
    rpc CreateAnonymousOrderOffline(CreateAnonymousOrderOfflineRequest) returns (StatusResponse) {} // tnt-1952
    rpc CreateAuthorizedOrderOffline(CreateAuthorizedOrderOfflineRequest) returns (StatusResponse) {} // tnt-1953

}

service Gift {
    rpc SendCodeByEmail(SendCodeByEmailRequest) returns (SendCodeResponse) {} // tnt-1243
    rpc SendCodeBySMS(SendCodeBySMSRequest) returns (SendCodeResponse) {}     // tnt-1243
    rpc VerifyCode(VerifyCodeRequest) returns (VerifyCodeResponse) {}         // tnt-1243
    rpc VerifyCodeOffline(VerifyCodeOfflineRequest) returns (VerifyCodeOfflineResponse) {} // tnt-1948
    rpc SendCodeBySmsOffline(SendCodeBySmsOfflineRequest) returns (StatusResponse) {} // tnt-1981
    rpc SendCodeByEmailOffline(SendCodeByEmailOfflineRequest) returns (StatusResponse) {} // tnt-1946
    rpc CreateCardOrder(CreateCardOrderRequest) returns (StatusResponse) {} // tnt-2000
    rpc UpdateStatus(UpdateCardStatusRequest) returns (StatusResponse) {} // tnt-1944
}

service Cart {
    rpc Recommendations(RecommendationsRequestCart) returns (RecommendationsResponse) {}
}

service Product {
    rpc Recommendations(RecommendationsRequestProduct) returns (RecommendationsResponse) {}
}

service Mailing {
    rpc Partnership(PartnershipRequest) returns (PartnershipResponse) {}
}

service Offline {
    rpc CodeOffline(CodeOfflineRequest) returns (StatusResponse) {}
    rpc Return(ReturnOfflineRequest) returns (StatusResponse) {}
    rpc CheckCodeOffline(CheckCodeOfflineRequest) returns (CheckCodeOfflineResponse) {} // tnt-1975
    rpc CallCodeOffline(CodeOfflineRequest) returns (StatusResponse) {} // tnt-2695
}

service ModernRetail {
    rpc SendCodeBySMS(SendCodeBySMSRequest) returns (SendCodeResponse) {}
    rpc VerifyCode(VerifyCodeRequest) returns (VerifyCodeResponse) {}
}

// ReviewsAuth аутентификация по номеру телефона для  feedbacks-tg-bot
// Если клиента с таким номером нет в Mindbox, SendCode создаёт его автоматически.
service ReviewsAuth {
    rpc SendCode(ReviewsSendCodeRequest) returns (ReviewsSendCodeResponse) {}     // операция MobileAuthorizationCodereviews
    rpc VerifyCode(ReviewsVerifyCodeRequest) returns (ReviewsVerifyCodeResponse) {} // операция MobileAuthorizationCodeCheckreviews
}

message PushClickParams {
    string message_unique_key = 1;
    string button_unique_key = 2;
}

message PushClickResponse {
    bool ok = 1;
}

message IsUserExistParams {
    string mobile_phone = 1;
}

message IsUserExistResponse {
    bool ok = 1;
    string client_id = 2;
}

message InitDeviceParams {
    string device_id = 1;
    string apns_token = 2;
}

message InitDeviceResponse {
    bool ok = 1;
}

enum Platform {
    IOS = 0;
    ANDROID = 1;
}

message InitClientParams {
    string device_id = 1;
    string client_id = 2;
    Platform platform = 3;
}

message InitClientResponse {
    bool ok = 1;
}

message ParamsUser {
    string client_id = 1;
}
message ResponseUser {
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string phone = 4;
    int32 bonus_total = 5;
    int32 bonus_available = 6;
    int32 bonus_blocked = 7;
    int32 total_paid_amount = 8;
    NearestExpiration nearest_expiration = 9;
    // TNT-2474
    string grade_fnf = 10;
    string personal_manager_fnf = 11;
}

message NearestExpiration {
    int32 total = 1;
    string date = 2;
}

message ParamsOrders {
    string client_id = 1;
    string date_from = 2;
    string date_to = 3;
    int32  limit = 4;
    int32  page = 5;
}
message ResponseOrders {
    int32 total = 1;
    repeated ResponseOrderData result = 2;
}

message ResponseOrderData {
    string order_id = 1;
    string created_date = 2;
    string payment_type = 3;
    int32 discounted_total_price = 4;
    int32 payment_amount = 5;
    int32 applied_discount = 6;
    int32 acquired_balance_change = 7;
    int32 created_ts = 8;
    string available_from_date_time = 9;
    string balance_change_kind = 10;
    string balance_change_kind_system_name = 11;
    string expiration_date_time = 12;
}

message ParamsCode {
    string mobile_phone = 1;
    string device_id = 2;
    string ip = 3;
    string platform = 4;
    string version = 5;
}

message ResponseCode {
    bool  ok = 1;
    int64 timestamp = 2;
}

message ParamsCheckCode {
    string mobile_phone = 1;
    string code = 2;
}
message ResponseCheckCode {
    bool   ok = 1;
    string status = 2;
    string client_id = 3;
    int32  mindbox_id = 4;
}

message ParamsEditUser {
    string device_uuid = 1;
    string client_id = 2;
    string mobile_phone = 3;
}

message ResponseEditUser {
    bool ok = 1;
}

message ParamsOSMICard {
    string client_id = 1;
}

message ResponseOSMICard {
    bool ok = 1;
}

message RemoveDeviceParams {
    string device_id = 1;
}

message RemoveDeviceResponse {
    bool ok = 1;
}

message BonusesHistoryRequest {
    Pagination pagination = 1;
    Filters filters = 2;
    string site_id = 3;
}

message Pagination {
    int32 limit = 1;
    int32 offset = 2;
}

message Filters {
    string date_from = 1;
    string date_to = 2;
}

message BonusesHistoryResponse {
    string status = 1;
    string message = 2;
    int64 code = 3;
    repeated BonusesHistoryResponseData data = 4;
    repeated Error errors = 5;
}

message Error {
    string target = 1;
    int64 code = 2;
    string message = 3;
}

message BonusesHistoryResponseData {
    string order_id = 1;
    string created_datetime = 2;
    int32 acquired_balance_change = 3;
    string available_from_datetime = 4;
    string balance_change_kind = 5;
