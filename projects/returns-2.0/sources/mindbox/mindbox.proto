message UnauthorizedPreorderOfflineRequest {
    PreorderOfflineOrder order = 1;
    string point_of_contact = 2;
}

message PreorderOfflineOrder {
    PreorderOfflineOrderIds ids = 1;
    PreorderOfflineOrderCustomFields custom_fields = 2;
    repeated PreorderOfflineLine lines = 3;
    // tnt-2707: баллы к списанию; заполняется только в AuthorizedPreorderOffline, в UnauthorizedPreorderOffline игнорируется.
    repeated AnonymousOrderOfflineBonusPoint bonus_points = 4;
}

message PreorderOfflineOrderIds {
    string external_system_storeez_com = 1;
}

message PreorderOfflineOrderCustomFields {
    string stylist = 1;
    string seller = 2;      // tnt-2705
    string seller_name = 3; // tnt-2705, в Mindbox/Maestra — customFields.sellername
}

message PreorderOfflineLine {
    int64 line_id = 1;
    int64 line_number = 2;
    double quantity = 3;
    double base_price_per_item = 4;
    PreorderOfflineProduct product = 5;
    PreorderOfflineLineStatus status = 6;
    PreorderOfflineLineCustomFields custom_fields = 7;
    repeated PreorderOfflineRequestedPromotion requested_promotions = 8;
}

message PreorderOfflineProduct {
    PreorderOfflineProductIds ids = 1;
}

message PreorderOfflineProductIds {
    string storeez_com = 1;
}

message PreorderOfflineLineStatus {
    PreorderOfflineLineStatusIds ids = 1;
