info:
  contact: {}
  description: Mobile API Gateway.
  termsOfService: http://swagger.io/terms/
  title: Mobile API Gateway
  version: "1.0"
paths:
  /api/v1/auth/generate-token:
    put:
      consumes:
      - application/json
      description: Use this method for register device. SAVE IT! You can't update
        or recreate REFRESH_TOKEN!!!
      parameters:
      - description: Application platform
        enum:
        - android
        - ios
        in: header
        name: X-Platform
        required: true
        type: string
      - description: Application version
        example: 1.16.1
        in: header
        name: X-Version
        required: true
        type: string
      - description: device id string
        example: 353703D6-7355-4F8F-80C4-869BE6AEACE8
        in: header
        name: x-device-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtoAuth.GenerateTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtoAuth.SiteAuthErrorResponse'
